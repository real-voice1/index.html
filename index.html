<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أذكار الصباح والمساء</title>
<style>
    body {
        font-family: 'Arial', sans-serif;
        background: linear-gradient(to bottom, #1e3c72, #2a5298);
        color: #fff;
        text-align: center;
        padding: 50px 20px;
    }

    h1 {
        font-size: 2.5em;
        margin-bottom: 20px;
        text-shadow: 2px 2px 4px #000;
    }

    .buttons {
        margin-bottom: 30px;
    }

    button {
        background-color: #ff9800;
        border: none;
        padding: 10px 25px;
        margin: 5px;
        font-size: 1.1em;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background-color: #e68900;
    }

    .zikr {
        background: rgba(0,0,0,0.3);
        padding: 20px;
        border-radius: 15px;
        max-width: 600px;
        margin: 0 auto;
        line-height: 1.8;
        font-size: 1.2em;
    }

    .count {
        margin-top: 15px;
        font-size: 1em;
        color: #ffd700;
    }
</style>
</head>
<body>

<h1>أذكار الصباح والمساء</h1>

<div class="buttons">
    <button onclick="showZikr('morning')">أذكار الصباح</button>
    <button onclick="showZikr('evening')">أذكار المساء</button>
</div>

<div class="zikr" id="zikr">
    اضغط على أي زر لعرض الأذكار
</div>

<div class="count" id="count"></div>

<script>
const morningZikr = [
    "أصبحنا وأصبح الملك لله...",
    "اللهم بك أصبحنا وبك أمسينا...",
    "اللهم إني أسألك خير هذا اليوم...",
    "سبحان الله وبحمده...",
    "أستغفر الله الذي لا إله إلا هو الحي القيوم وأتوب إليه..."
];

const eveningZikr = [
    "أمسينا وأمسى الملك لله...",
    "اللهم بك أمسينا وبك أصبحنا...",
    "اللهم إني أسألك خير هذه الليلة...",
    "سبحان الله وبحمده...",
    "أستغفر الله الذي لا إله إلا هو الحي القيوم وأتوب إليه..."
];

let currentIndex = 0;
let currentList = [];

function showZikr(type) {
    currentIndex = 0;
    currentList = type === 'morning' ? morningZikr : eveningZikr;
    displayZikr();
}

function displayZikr() {
    if(currentIndex < currentList.length){
        document.getElementById('zikr').innerText = currentList[currentIndex];
        document.getElementById('count').innerText = `الذكر رقم: ${currentIndex + 1} / ${currentList.length}`;
        currentIndex++;
    } else {
        document.getElementById('zikr').innerText = "انتهت جميع الأذكار!";
        document.getElementById('count').innerText = "";
    }
}

// للتنقل بين الأذكار بالضغط على الزكر نفسه
document.getElementById('zikr').addEventListener('click', displayZikr);
</script>

</body>

    </div>
</div>
